version: '3'

services:

  db:
    image: 'postgres:latest'
    container_name: postgres-benjaminc
    build:
      context: ./postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=demo01
    
    volumes:
      - pg-data:/var/lib/postgresql/data

  
  backend:
    image: benjacv/backend:latest
    container_name: backend-benjaminc
    build:
      context: ./Test01/Test01
    
    ports:
      - "9991:9991"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/demo01
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=1234
    depends_on:
      - db

  frontend:
    image: benjacv/frontend:latest
    container_name: frontend-benjaminc
    build:
      context: ./test02 
    ports:
      - "8881:8881"
    depends_on:
      - db

volumes:
  pg-data:
